<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energie Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #f4f6f8;
}
h1 {
  color: #1565c0;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  margin-bottom: 30px;
}
.lowest {
  background: #c8f7c5;
}
</style>
</head>
<body>

<h1>⚡ Stroomprijzen Nederland (Vandaag)</h1>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h2>Goedkoopste 3 uren</h2>
  <table id="cheapTable" border="1" width="100%" cellpadding="8">
    <thead>
      <tr><th>Uur</th><th>Prijs €/kWh</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
async function loadData() {
  try {

    const response = await fetch("https://www.stroomprijzen.nl/api/v1/prices");
    const data = await response.json();

    const prices = data.data.map(p => p.price / 1000);
    const labels = data.data.map(p => p.hour + ":00");

    renderChart(labels, prices);
    renderCheapest(labels, prices);

  } catch (e) {
    alert("Kon prijzen niet laden. Controleer internet.");
  }
}

function renderChart(labels, prices) {

  const ctx = document.getElementById("chart");

  new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "€/kWh",
        data: prices,
        tension: 0.3
      }]
    }
  });
}

function renderCheapest(labels, prices) {

  const sorted = prices
    .map((p, i) => ({ price: p, hour: labels[i] }))
    .sort((a, b) => a.price - b.price)
    .slice(0, 3);

  const tbody = document.querySelector("#cheapTable tbody");
  tbody.innerHTML = "";

  sorted.forEach(item => {
    const row = document.createElement("tr");
    row.classList.add("lowest");
    row.innerHTML = `<td>${item.hour}</td><td>${item.price.toFixed(3)}</td>`;
    tbody.appendChild(row);
  });
}

loadData();
</script>

</body>
</html>
