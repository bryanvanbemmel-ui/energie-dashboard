<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroom & Gas Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #f4f6f8;
}
h1 {
  color: #1565c0;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  margin-bottom: 30px;
}
.lowest {
  background: #c8f7c5;
}
.refresh {
  font-size: 14px;
  color: gray;
}
</style>
</head>
<body>

<h1>⚡ Stroomprijzen Vandaag & Morgen</h1>

<div class="card">
  <canvas id="priceChart"></canvas>
</div>

<div class="card">
  <h2>📋 Overzicht goedkoopste uren</h2>
  <table id="cheapestTable" width="100%" border="1" cellspacing="0" cellpadding="8">
    <thead>
      <tr><th>Uur</th><th>Prijs €/kWh</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="refresh">
Laatste update: <span id="lastUpdate"></span>
</div>

<script>
async function loadPrices() {

  const start = getDate(0);
  const end = getDate(1);

  const response = await fetch(
    `https://api.energy-charts.info/price?bzn=NL&start=${start}&end=${end}`
  );
  const data = await response.json();

  const prices = data.price.map(p => p / 1000);
  const labels = prices.map((_, i) => i + ":00");

  renderChart(labels, prices);
  renderCheapest(labels, prices);

  document.getElementById("lastUpdate").textContent =
    new Date().toLocaleString();

}

function renderChart(labels, prices) {

  const ctx = document.getElementById("priceChart").getContext("2d");

  if (window.myChart) {
    window.myChart.destroy();
  }

  window.myChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Prijs €/kWh",
        data: prices,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: false
        }
      }
    }
  });
}

function renderCheapest(labels, prices) {

  const sorted = prices
    .map((p, i) => ({ price: p, hour: labels[i] }))
    .sort((a, b) => a.price - b.price)
    .slice(0, 3);

  const tbody = document.querySelector("#cheapestTable tbody");
  tbody.innerHTML = "";

  sorted.forEach(item => {
    const row = document.createElement("tr");
    row.classList.add("lowest");
    row.innerHTML = `<td>${item.hour}</td><td>${item.price.toFixed(3)}</td>`;
    tbody.appendChild(row);
  });

}

function getDate(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split("T")[0];
}

loadPrices();

// Automatisch refreshen elke 30 minuten
setInterval(loadPrices, 1800000);

</script>

</body>
</html>
